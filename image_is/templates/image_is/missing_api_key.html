{% extends "image_is/base.html" %}

{% block title %}API key missing · Image Analysis{% endblock %}

{% block content %}
<div class="layout narrow">
  <section class="panel">
    <h2>{{ lab.setting_name }} was not found</h2>
    <p>
      Add your {{ lab.lab_label }} key to the project root
      <code class="inline">.env</code>
      file as <code class="inline">{{ lab.setting_name }}</code>,
      then restart the server.
    </p>
  </section>
</div>
{% endblock %}
